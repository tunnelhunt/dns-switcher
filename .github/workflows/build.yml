name: Build & Release macOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build DNSSwitcher.app (Universal Binary)
        run: ./build-app.sh --universal

      - name: Verify Universal Binary & Code Signature
        run: |
          file DNSSwitcher.app/Contents/MacOS/DNSSwitcher
          lipo -info DNSSwitcher.app/Contents/MacOS/DNSSwitcher
          codesign -dv --verbose=4 DNSSwitcher.app || true

      - name: Package ZIP & DMG
        run: |
          ditto -c -k --sequesterRsrc --keepParent DNSSwitcher.app DNSSwitcher-macOS.zip
          hdiutil create -volname "AI DNS Switcher" -srcfolder DNSSwitcher.app -ov -format UDZO DNSSwitcher.dmg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DNSSwitcher-macOS
          path: |
            DNSSwitcher-macOS.zip
            DNSSwitcher.dmg

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DNSSwitcher-macOS.zip
            DNSSwitcher.dmg
          generate_release_notes: true
